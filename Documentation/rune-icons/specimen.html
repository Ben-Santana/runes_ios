<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Runes icon set</title><style>
:root{--paper:#fff;--ink:#191919;--muted:#696969;--rule:#e8e8e8;--soft:#fafafa}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--paper:#0b0b0c;--ink:#ededed;--muted:#8e8e8e;--rule:#262628;--soft:#141416}}
:root[data-theme=dark]{--paper:#0b0b0c;--ink:#ededed;--muted:#8e8e8e;--rule:#262628;--soft:#141416}
*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:15px/1.45 Geist,-apple-system,system-ui,sans-serif}
main{max-width:1040px;margin:0 auto;padding:56px 20px 72px}
h1{font-size:28px;font-weight:500;letter-spacing:-.6px;margin:0 0 6px}p.lede{color:var(--muted);margin:0;max-width:60ch}
h2{font-size:14px;font-weight:500;margin:44px 0 0;padding-bottom:10px;border-bottom:1px solid var(--rule);display:flex;justify-content:space-between}
h2 small{font-weight:400;font-size:12px;color:var(--muted)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr))}
figure{margin:0;padding:22px 14px 18px 0;border-bottom:1px solid var(--rule)}
.glyph{height:72px;display:flex;align-items:center}
figcaption b{display:block;font-weight:500;font-size:14px}figcaption span{display:block;font-size:12px;color:var(--muted);min-height:34px}
.row{display:flex;flex-wrap:wrap;gap:6px 14px;padding:16px 0;border-bottom:1px solid var(--rule);align-items:center}.row span{display:flex}
.row i{font-style:normal;font-size:12px;color:var(--muted);width:44px}
.invert{background:var(--ink);color:var(--paper);border-radius:8px;padding:16px 14px;border:0;margin-top:16px}.invert i{color:inherit;opacity:.6}
</style></head><body><main>
<h1>Runes</h1><p class="lede">Twenty glyphs built from four strokes. Each one is drawn in a 24-unit box at a 1.5 stroke with round ends, so it sits beside the app's existing icons.</p>
<h2>Grammar <small>4 strokes, 1 rule</small></h2><div class="grid"><figure><div class="glyph"><svg xmlns="http://www.w3.org/2000/svg" width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4V20"/></svg></div><figcaption><b>Stave</b><span>A finger.</span></figcaption></figure><figure><div class="glyph"><svg xmlns="http://www.w3.org/2000/svg" width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M10.75 12a1.25 1.25 0 1 0 2.5 0a1.25 1.25 0 1 0 -2.5 0ZM11.5 12a0.5 0.5 0 1 0 1 0a0.5 0.5 0 1 0 -1 0Z"/></svg></div><figcaption><b>Bead</b><span>A touch.</span></figcaption></figure><figure><div class="glyph"><svg xmlns="http://www.w3.org/2000/svg" width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M9 12a3 3 0 1 0 6 0a3 3 0 1 0 -6 0Z"/></svg></div><figcaption><b>Ring</b><span>A touch that lasts. It falls when let go.</span></figcaption></figure><figure><div class="glyph"><svg xmlns="http://www.w3.org/2000/svg" width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M6 8A6.5 6.5 0 0 1 18 8"/></svg></div><figcaption><b>Arc</b><span>Anything that moves.</span></figcaption></figure><figure><div class="glyph"><svg xmlns="http://www.w3.org/2000/svg" width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M8.5 9V20M15.5 4V20"/></svg></div><figcaption><b>Second stave</b><span>The middle finger.</span></figcaption></figure></div>
<h2>Gestures <small>15</small></h2><div class="grid"><figure><div class="glyph"><svg xmlns="http://www.w3.org/2000/svg" width="56" height="56" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4V20M10.75 12a1.25 1.25 0 1 0 2.5 0a1.25 1.25 0 1 0 -2.5 0ZM11.5 12a0.5 0.5 0 1 0 1 0a0.5 0.5 0 1 0 -1 0Z"/></svg></div><figcaption><b>Tap index</b><span>A stave with one bead: the finger touches once.</span></figcaption></figure><figure><div class="glyph"><svg xmlns="http://www.w3.org/2000/svg" width="56" height="56" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M8.5 9V20M15.5 4V20M14.25 12a1.25 1.25 0 1 0 2.5 0a1.25 1.25 0 1 0 -2.5 0ZM15 12a0.5 0.5 0 1 0 1 0a0.5 0.5 0 1 0 -1 0Z"/></svg></div><figcaption><b>Tap middle</b><span>The same touch on the taller, second stave.</span></figcaption></figure><figure><div class="glyph"><svg xmlns="http://www.w3.org/2000/svg" width="56" height="56" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4V20M10.75 8.5a1.25 1.25 0 1 0 2.5 0a1.25 1.25 0 1 0 -2.5 0ZM11.5 8.5a0.5 0.5 0 1 0 1 0a0.5 0.5 0 1 0 -1 0ZM10.75 15.5a1.25 1.25 0 1 0 2.5 0a1.25 1.25 0 1 0 -2.5 0ZM11.5 15.5a0.5 0.5 0 1 0 1 0a0.5 0.5 0 1 0 -1 0Z"/></svg></div><figcaption><b>Double tap index</b><span>Two beads, two touches.</span></figcaption></figure><figure><div class="glyph"><svg xmlns="http://www.w3.org/2000/svg" width="56" height="56" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M8.5 9V20M15.5 4V20M14.25 8.5a1.25 1.25 0 1 0 2.5 0a1.25 1.25 0 1 0 -2.5 0ZM15 8.5a0.5 0.5 0 1 0 1 0a0.5 0.5 0 1 0 -1 0ZM14.25 15.5a1.25 1.25 0 1 0 2.5 0a1.25 1.25 0 1 0 -2.5 0ZM15 15.5a0.5 0.5 0 1 0 1 0a0.5 0.5 0 1 0 -1 0Z"/></svg></div><figcaption><b>Double tap middle</b><span>Two touches on the second stave.</span></figcaption></figure><figure><div class="glyph"><svg xmlns="http://www.w3.org/2000/svg" width="56" height="56" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M9 7a3 3 0 1 0 6 0a3 3 0 1 0 -6 0ZM12 10V20"/></svg></div><figcaption><b>Hold index</b><span>A ring held up at the head of the stave.</span></figcaption></figure><figure><div class="glyph"><svg xmlns="http://www.w3.org/2000/svg" width="56" height="56" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M8.5 9V20M12.5 7a3 3 0 1 0 6 0a3 3 0 1 0 -6 0ZM15.5 10V20"/></svg></div><figcaption><b>Hold middle</b><span>A ring held up on the second stave.</span></figcaption></figure><figure><div class="glyph"><svg xmlns="http://www.w3.org/2000/svg" width="56" height="56" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4V14M9 17a3 3 0 1 0 6 0a3 3 0 1 0 -6 0Z"/></svg></div><figcaption><b>Release index</b><span>The same ring, fallen to the foot: the hold let go.</span></figcaption></figure><figure><div class="glyph"><svg xmlns="http://www.w3.org/2000/svg" width="56" height="56" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M8.5 9V20M15.5 4V14M12.5 17a3 3 0 1 0 6 0a3 3 0 1 0 -6 0Z"/></svg></div><figcaption><b>Release middle</b><span>The second stave lets its ring fall.</span></figcaption></figure><figure><div class="glyph"><svg xmlns="http://www.w3.org/2000/svg" width="56" height="56" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20V4M6 8A6.5 6.5 0 0 1 18 8"/></svg></div><figcaption><b>Swipe up</b><span>A stave under an arc: the way it travels.</span></figcaption></figure><figure><div class="glyph"><svg xmlns="http://www.w3.org/2000/svg" width="56" height="56" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4V20M6 16A6.5 6.5 0 0 0 18 16"/></svg></div><figcaption><b>Swipe down</b><span></span></figcaption></figure><figure><div class="glyph"><svg xmlns="http://www.w3.org/2000/svg" width="56" height="56" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M20 12H4M8 6A6.5 6.5 0 0 0 8 18"/></svg></div><figcaption><b>Swipe left</b><span></span></figcaption></figure><figure><div class="glyph"><svg xmlns="http://www.w3.org/2000/svg" width="56" height="56" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12H20M16 6A6.5 6.5 0 0 1 16 18"/></svg></div><figcaption><b>Swipe right</b><span></span></figcaption></figure><figure><div class="glyph"><svg xmlns="http://www.w3.org/2000/svg" width="56" height="56" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5A7 7 0 1 1 5 12M3.75 12a1.25 1.25 0 1 0 2.5 0a1.25 1.25 0 1 0 -2.5 0ZM4.5 12a0.5 0.5 0 1 0 1 0a0.5 0.5 0 1 0 -1 0Z"/></svg></div><figcaption><b>Rotation</b><span>A bead carried round an open orbit: the wrist turns.</span></figcaption></figure><figure><div class="glyph"><svg xmlns="http://www.w3.org/2000/svg" width="56" height="56" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 13.5V5M12 13.5L5 17.5M12 13.5L19 17.5M10.75 13.5a1.25 1.25 0 1 0 2.5 0a1.25 1.25 0 1 0 -2.5 0ZM11.5 13.5a0.5 0.5 0 1 0 1 0a0.5 0.5 0 1 0 -1 0Z"/></svg></div><figcaption><b>Movement</b><span>Three ways out from one point: the hand moves in space.</span></figcaption></figure><figure><div class="glyph"><svg xmlns="http://www.w3.org/2000/svg" width="56" height="56" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M4 16C9 16 15.5 12.5 15.5 8.5A3.5 3.5 0 0 0 8.5 8.5C8.5 12.5 13.5 16 17.5 16M17.75 16a1.25 1.25 0 1 0 2.5 0a1.25 1.25 0 1 0 -2.5 0ZM18.5 16a0.5 0.5 0 1 0 1 0a0.5 0.5 0 1 0 -1 0Z"/></svg></div><figcaption><b>Air shape</b><span>A line that loops and lands: a shape traced in the air.</span></figcaption></figure></div>
<h2>Hold and release <small>one rune, two states</small></h2><div class="grid">
<figure><div class="glyph"><svg xmlns="http://www.w3.org/2000/svg" width="56" height="56" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="7" r="3"><animate attributeName="cy" values="7;7;17;17;7" dur="3.2s" repeatCount="indefinite" calcMode="spline" keyTimes="0;0.4;0.47;0.9;1" keySplines="0 0 1 1;0.6 0 1 0.9;0 0 1 1;0.2 0 0 1"/></circle><line x1="12" x2="12" y1="4" y2="4"><animate attributeName="y2" values="4;4;14;14;4" dur="3.2s" repeatCount="indefinite" calcMode="spline" keyTimes="0;0.4;0.47;0.9;1" keySplines="0 0 1 1;0.6 0 1 0.9;0 0 1 1;0.2 0 0 1"/></line><line x1="12" x2="12" y1="10" y2="20"><animate attributeName="y1" values="10;10;20;20;10" dur="3.2s" repeatCount="indefinite" calcMode="spline" keyTimes="0;0.4;0.47;0.9;1" keySplines="0 0 1 1;0.6 0 1 0.9;0 0 1 1;0.2 0 0 1"/></line></svg></div><figcaption><b>Index</b><span>Held up, then dropped on release.</span></figcaption></figure>
<figure><div class="glyph"><svg xmlns="http://www.w3.org/2000/svg" width="56" height="56" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M8.5 9V20"/><circle cx="15.5" cy="7" r="3"><animate attributeName="cy" values="7;7;17;17;7" dur="3.2s" repeatCount="indefinite" calcMode="spline" keyTimes="0;0.4;0.47;0.9;1" keySplines="0 0 1 1;0.6 0 1 0.9;0 0 1 1;0.2 0 0 1"/></circle><line x1="15.5" x2="15.5" y1="4" y2="4"><animate attributeName="y2" values="4;4;14;14;4" dur="3.2s" repeatCount="indefinite" calcMode="spline" keyTimes="0;0.4;0.47;0.9;1" keySplines="0 0 1 1;0.6 0 1 0.9;0 0 1 1;0.2 0 0 1"/></line><line x1="15.5" x2="15.5" y1="10" y2="20"><animate attributeName="y1" values="10;10;20;20;10" dur="3.2s" repeatCount="indefinite" calcMode="spline" keyTimes="0;0.4;0.47;0.9;1" keySplines="0 0 1 1;0.6 0 1 0.9;0 0 1 1;0.2 0 0 1"/></line></svg></div><figcaption><b>Middle</b><span>The same fall on the second stave.</span></figcaption></figure></div>
<h2>Everyday <small>5</small></h2><div class="grid"><figure><div class="glyph"><svg xmlns="http://www.w3.org/2000/svg" width="56" height="56" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 20V11A7 7 0 0 1 19 11V20M10.75 15a1.25 1.25 0 1 0 2.5 0a1.25 1.25 0 1 0 -2.5 0ZM11.5 15a0.5 0.5 0 1 0 1 0a0.5 0.5 0 1 0 -1 0Z"/></svg></div><figcaption><b>Home</b><span>An arch with someone in it.</span></figcaption></figure><figure><div class="glyph"><svg xmlns="http://www.w3.org/2000/svg" width="56" height="56" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 17.5V5M12 5A4 4 0 0 1 16 9M8.75 17.5a1.25 1.25 0 1 0 2.5 0a1.25 1.25 0 1 0 -2.5 0ZM9.5 17.5a0.5 0.5 0 1 0 1 0a0.5 0.5 0 1 0 -1 0Z"/></svg></div><figcaption><b>Music</b><span>A stave that carries a note.</span></figcaption></figure><figure><div class="glyph"><svg xmlns="http://www.w3.org/2000/svg" width="56" height="56" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M8 12a4 4 0 1 0 8 0a4 4 0 1 0 -8 0ZM12 2.5V4.5M12 19.5V21.5M2.5 12H4.5M19.5 12H21.5"/></svg></div><figcaption><b>Light</b><span>A ring that gives off four rays.</span></figcaption></figure><figure><div class="glyph"><svg xmlns="http://www.w3.org/2000/svg" width="56" height="56" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 4H19M5 20H19M5 4A7 8 0 0 0 19 4M5 20A7 8 0 0 1 19 20"/></svg></div><figcaption><b>Time</b><span>Two bowls meeting at a point.</span></figcaption></figure><figure><div class="glyph"><svg xmlns="http://www.w3.org/2000/svg" width="56" height="56" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M11.36 7.4A6 6 0 0 1 11.36 16.6M15.28 4.22A11 11 0 0 1 15.28 19.78M6.25 12a1.25 1.25 0 1 0 2.5 0a1.25 1.25 0 1 0 -2.5 0ZM7 12a0.5 0.5 0 1 0 1 0a0.5 0.5 0 1 0 -1 0Z"/></svg></div><figcaption><b>Voice</b><span>A bead that sends two arcs outward.</span></figcaption></figure></div>
